# ZC8 NATS Server Configuration — Local Development
# ─────────────────────────────────────────────────────────────────────────────
# Enables:
#   • JetStream (persistent streams for telemetry ingestion)
#   • WebSocket on port 4223 (browser-direct access via nats.ws)
#
# NOTE: No authentication in local dev — open access for simplicity.
# For production, add auth_callout with API JWT validation and NKey signing.
# ─────────────────────────────────────────────────────────────────────────────

# JetStream storage
jetstream {
  store_dir: "/data"
}

# Monitoring HTTP endpoint
monitor_port: 8222

# WebSocket endpoint for browser-direct NATS access (nats.ws)
websocket {
  port: 4223
  no_tls: true   # Use TLS in production
}
