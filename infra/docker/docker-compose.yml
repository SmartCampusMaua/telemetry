name: telemetry

services:
  mqtt:
    image: telemetry-services-input-mqtt
    build:
      # Repo root — this service's Dockerfile COPYs sibling packages
      # (go-config/go-data/go-parse) via the repo's go.work layout.
      context: ../..
      dockerfile: services/input/mqtt/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    volumes:
      # ../infra.docker.json: same shape as infra.example.json, but with
      # influxdb.host set to http://influxdb3-core:8181 (the shared zc2x
      # influxdb3-core, reached by its container name on the docker_default
      # network, not localhost:8181 like ../infra.json which is only valid
      # for `go run` on the host) and registry.api_url set to
      # http://host.docker.internal:3333 (the `api` repo's registry service
      # currently runs directly on the host, not as a container on this
      # network — host.docker.internal is Docker Desktop's route to the
      # host). Gitignored, create it locally. Mounted at the same path the
      # Dockerfile bakes in via INFRA_CONFIG_FILE; the k8s manifest mounts
      # the equivalent from a ConfigMap/Secret volume at that same path
      # instead of setting any of these as env vars itself.
      - ../infra.docker.json:/etc/mqtt/infra.json:ro
    networks:
      - zc2x

  chirpstackv4:
    image: telemetry-services-bridge-chirpstackv4
    build:
      # Repo root — this service's Dockerfile COPYs the sibling go-config
      # package via the repo's go.work layout.
      context: ../..
      dockerfile: services/bridge/chirpstackv4/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    volumes:
      # Same shared infra.docker.json as mqtt above — this service only
      # reads mqtt.* and registry.api_url out of it, ignoring influxdb.*.
      - ../infra.docker.json:/etc/chirpstackv4/infra.json:ro
    networks:
      - zc2x

  api:
    image: telemetry-apps-api
    build:
      # apps/api is a standalone checkout (its own git history) that hasn't
      # been folded into this monorepo's Go workspace — its Dockerfile is
      # self-contained, so its build context is its own directory, not the
      # repo root.
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - "3333:3333"
    volumes:
      # apps/api's own infra.json/sensors.json/devices.json/assets.json —
      # see apps/api/README.md's "Docker / Kubernetes" section. Gitignored;
      # create them locally under apps/api/ before starting this service.
      - ../../apps/api/infra.json:/etc/api/infra.json:ro
      - ../../apps/api/sensors.json:/etc/api/sensors.json:ro
      - ../../apps/api/devices.json:/etc/api/devices.json:ro
      - ../../apps/api/assets.json:/etc/api/assets.json:ro
    networks:
      - zc2x

networks:
  zc2x:
    name: docker_default
    external: true
